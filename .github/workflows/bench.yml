name: bench

# Measures the branch it runs on against an earlier commit on a macOS 26 runner and puts
# the report in the run summary; see tools/bench/run.sh. Manual only: about 30 minutes.
on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Commit or tag to compare against
        default: v1.4
      idle:
        description: Idle phase, seconds
        default: '600'

jobs:
  bench:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Measure
        env:
          BASELINE: ${{ inputs.baseline }}
          IDLE: ${{ inputs.idle }}
          OPEN: '40'
          ROUNDS: '3'
        run: |
          # App Nap would throttle whichever build's status item ends up hidden
          defaults write NSGlobalDomain NSAppSleepDisabled -bool YES
          tools/bench/run.sh "$BASELINE"
      - name: Report
        if: always()
        run: |
          for f in bench-out/*.log; do echo "== $f"; tail -n 20 "$f"; done
          if [ -f bench-out/report.md ]; then
            cat bench-out/report.md >> "$GITHUB_STEP_SUMMARY"
            cat bench-out/report.md
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-out
          path: bench-out
